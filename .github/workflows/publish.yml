name: Build and Publish to GHCR

on:
  schedule:
    - cron: '0 1 * * *' # Runs daily at 01:00 UTC, after the Sync Upstream Tags workflow for cache optimization
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      claude_code_version:
        description: 'Specify a custom version of @anthropic-ai/claude-code to build with (e.g., "2.1.168")'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: huangyxi/cloudcli

jobs:
  build:
    name: Build and Push Multi-Arch Docker Images
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform:
          - arch: linux/amd64
            runner: ubuntu-latest
          - arch: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare environment variables
        run: |
          echo "FULL_IMAGE_NAME=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_ENV
          CLOUDCLI_REF='main'
          if [ "${{ github.ref_type }}" = "tag" ]; then
            "CLOUDCLI_REF=${{ github.ref_name }}"
          fi
          echo "CLOUDCLI_REF=$CLOUDCLI_REF" >> $GITHUB_ENV
          echo "CLOUDCLI_HEAD=$(git -c http.version=2 ls-remote https://github.com/siteboon/claudecodeui.git HEAD | awk '{print $1}')" >> $GITHUB_ENV
          CLAUDE_CODE_VERSION='${{ github.event.inputs.claude_code_version }}'
          CLAUDE_CODE_VERSION="${CLAUDE_CODE_VERSION:-latest}"
          [[ $CLAUDE_CODE_VERSION == latest ]] &&
            CLAUDE_CODE_VERSION="$(npm view @anthropic-ai/claude-code version)"
          echo "CLAUDE_CODE_VERSION=$CLAUDE_CODE_VERSION" >> "$GITHUB_ENV"
          platform=${{ matrix.platform.arch }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> ${GITHUB_ENV}
      - name: Extract metadata for Docker images
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Extract metadata for Docker cache
        id: cache-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            ${{ github.ref_type == 'tag' && 'type=raw,value=main' || '' }}
          flavor: |
            prefix=cache-${{ matrix.platform.arch }}-
            latest=false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          build-args: |
            CLAUDE_CODE_VERSION=${{ env.CLAUDE_CODE_VERSION }}
            CLOUDCLI_REF=${{ env.CLOUDCLI_REF }}
            CLOUDCLI_HEAD=${{ env.CLOUDCLI_HEAD }}
          context: .
          platforms: ${{ matrix.platform.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          outputs: type=image,name=${{ env.FULL_IMAGE_NAME }},push-by-digest=${{ github.event_name != 'pull_request' }},name-canonical=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.cache-meta.outputs.tags }}
          cache-to: type=registry,ref=${{ steps.cache-meta.outputs.tags }},mode=max
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Multi-Arch Images and Finalize Tags
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.event_name != 'pull_request' && !cancelled() }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare environment
        run: |
          echo "FULL_IMAGE_NAME=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_ENV
      - name: Download digests
        id: download
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true
        continue-on-error: true
      - name: Check digests
        id: check
        run: |
          count=$(find /tmp/digests -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "digest_count=$count" >> $GITHUB_OUTPUT
          if [ "$count" -lt 2 ]; then
            echo "::warning::Found $count digest(s), need 2 (one per arch). Skipping merge."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for Docker images
        if: steps.check.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create manifest list and push
        if: steps.check.outputs.skip != 'true'
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.FULL_IMAGE_NAME }}@sha256:%s ' *)
      - name: Inspect image
        if: steps.check.outputs.skip != 'true'
        run: |
          docker buildx imagetools inspect ${{ env.FULL_IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  delete-images:
    name: Delete Unused Images from GHCR
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete untagged images from GHCR
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: cloudcli
          older-than: 3 days
      - name: Delete cache images from GHCR
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: cloudcli
          delete-tags: 'cache-*'
          keep-n-tagged: 2
